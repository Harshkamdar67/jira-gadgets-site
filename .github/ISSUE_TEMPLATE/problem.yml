name: Something isn't working
description: A gadget shows wrong numbers, an error, a grey box, or doesn't save.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Requests here are public, so please leave out confidential details such as issue summaries or customer names. For security problems, use security@harshkamdar.com instead.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Epic Progress
        - Release Progress
        - Dashboard Notes
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include any error message the gadget shows, word for word.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Project type
      options:
        - Company-managed
        - Team-managed
        - Not sure
  - type: input
    id: settings
    attributes:
      label: Gadget settings
      description: For example "Epics in project ABC, measured by story points, sorted by due date". Leave out anything confidential.
  - type: dropdown
    id: theme
    attributes:
      label: Light or dark theme?
      options:
        - Light
        - Dark
        - Not sure
